<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automation Quest — Mission 01</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7fb;color:#20242c}.app{max-width:760px;margin:auto;min-height:100vh;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:800}.tag{font-size:13px;color:#687080}.card{background:white;border-radius:22px;padding:26px;box-shadow:0 8px 30px rgba(30,40,70,.08);margin-bottom:16px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#667085;margin-bottom:10px}.scene{font-size:20px;line-height:1.45;margin:0 0 18px}.message{background:#f0f3f8;border-radius:16px;padding:16px;line-height:1.5;margin:16px 0}.choices{display:grid;gap:10px}.choice{width:100%;border:1px solid #d9dee8;background:white;border-radius:14px;padding:15px;text-align:left;font-size:16px;cursor:pointer}.choice:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.06)}.choice:disabled{cursor:default;opacity:.65}.result{margin-top:16px;padding:16px;border-radius:16px;background:#f7f8fa;line-height:1.55}.result strong{display:block;margin-bottom:6px}.next{margin-top:14px;width:100%;padding:15px;border:0;border-radius:14px;background:#20242c;color:white;font-size:16px;font-weight:700;cursor:pointer}.small{font-size:14px;color:#687080;line-height:1.5}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef0f5;font-size:12px;font-weight:700;margin:3px 4px 3px 0}.hidden{display:none}.log{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ending{text-align:center}.ending h1{font-size:30px}.restart{margin-top:12px;background:white;color:#20242c;border:1px solid #d9dee8}
</style></head>
<body><div class="app">
<div class="top"><div class="brand">⚡ Automation Quest</div><div class="tag">World 1 · Mission 01</div></div>
<div id="game"></div>
</div>
<script>
const nodes={
start:{title:"Don't automate the wrong problem",scene:"Mia runs a handmade-gift business. Her team receives about 80 customer messages a day, and everyone feels overwhelmed.",message:'Mia says: “Can you automate my customer messages? We really need help.”',choices:[
 ['Map what is actually happening before building anything.', 'map', 'You slow down for a moment. Instead of guessing what to automate, you decide to see where the work is really going.'],
 ['Buy an AI chatbot so it can answer customers immediately.', 'chatbot', 'You have something impressive quickly — but you still don’t know whether the chatbot is solving the real bottleneck.'],
 ['Ask AI to design the whole system for you.', 'design', 'AI gives you a polished-looking system. But it was designed from assumptions, not from Mia’s actual workflow.'] ]},
map:{title:"You open the inbox",scene:"You spend 15 minutes observing the workflow. The messages fall into a few patterns.",message:'25/day — opening hours & basic info<br>20/day — “Where is my order?”<br>15/day — customisation questions<br>10/day — pricing & payment<br>5/day — damaged/wrong orders<br>5/day — other',choices:[
 ['Start with opening-hours questions: frequent, repetitive and low risk.', 'faq', 'A quick win appears. A large chunk of repetitive work can disappear without asking AI to make difficult decisions.'],
 ['Start with damaged orders because they sound important.', 'damage', 'They are important — but importance does not automatically make them the best first automation target. They need judgement and exceptions.'],
 ['Automate everything at once.', 'scope', 'The idea sounds efficient, but now you have multiple workflows, more testing and more ways for something to go wrong.'] ]},
faq:{title:"The quick win",scene:"Opening-hours questions are predictable. The answer is the same every time.",message:'You decide: “This does not need AI to think. It needs a reliable rule and an automatic response.”',choices:[
 ['Move on and look at a workflow that needs more judgement.', 'order', 'Good. You have reduced repetitive work without pretending every problem needs AI.'] ]},
damage:{title:"A useful warning",scene:"A damaged-order message can require refunds, replacements, apologies or investigation.",message:'You realise: the goal is not to automate the highest-stakes work first. The goal is to automate the right part of the process safely.',choices:[['Choose a predictable workflow next.', 'order', 'You keep the human involved where judgement matters.'] ]},
scope:{title:"Scope creep",scene:"Mia has a $1,000 budget and wants a useful system within 7 days.",message:'Trying to automate everything would multiply the number of rules, tests and exceptions. You decide to narrow the first project.',choices:[['Return to one clear workflow.', 'order', 'Exactly. A small complete system is more useful than a huge unfinished one.'] ]},
order:{title:"Now Mia asks about order status",scene:'Mia points to the next biggest source of interruptions: “Where is my order?”',message:'Customer: “Hi! Where is my order? #1042”',choices:[
 ['Let AI write an answer from whatever it remembers.', 'badstatus', 'Danger. A fluent answer is not the same thing as a trustworthy answer.'],
 ['Have AI understand the request, then have automation check the live order system.', 'status', 'Now the responsibilities are separated: AI interprets the message; automation retrieves the actual data.'] ]},
badstatus:{title:"A convincing mistake",scene:'The customer gets: “Your order is arriving tomorrow!” But the courier system says it is delayed.',message:'Mia looks at you: “How do we stop the AI from making things up?”',choices:[['Use the real order system as the source of truth.', 'guard', 'Yes. The AI should not invent the status; it should use current evidence from the system.'] ]},
status:{title:"Build the boundary",scene:'The system finds order #1042 and sees: Shipped · ETA Friday.',message:'You now need to decide when the system is allowed to answer automatically — and when a person should step in.',choices:[
 ['If the order exists, the status is current, and the request is straightforward → answer. Otherwise → human.', 'guard', 'That is a safe automation boundary: automate predictable cases and escalate exceptions.'],
 ['Always answer if an order number exists.', 'guard', 'An order number alone is not enough. The status could be unusual, outdated or inconsistent.'] ]},
guard:{title:"One more complication",scene:'A customer says: “It says delivered, but I never received it.”',message:'The system has a delivery status — but the customer’s situation does not fit the normal case.',choices:[['Send the standard “delivered” message.', 'exception', 'That would ignore important information from the customer.'],['Escalate to a human to investigate.', 'monitor', 'Exactly. The data says delivered, but the customer says otherwise. This is an exception that needs judgement.'] ]},
exception:{title:"The exception matters",scene:'You stop and ask: “What does the system know, and what does the customer know?”',message:'A good automation does not blindly follow one field in a database. It checks whether the situation is safe and predictable.',choices:[['Escalate this case and keep the normal path automatic.', 'monitor', 'Good. You preserve the fast path while protecting unusual cases.'] ]},
monitor:{title:"Mia asks the final question",scene:'“Okay — but what if the system starts making mistakes? How would we know?”',message:'Normally, Mia receives about 2 complaints a day about delivery problems. Today there are 18.',choices:[['Do nothing unless every individual case fails.', 'endbad', 'You would discover the problem one customer at a time — too late.'],['Monitor the normal baseline and alert Mia when the pattern becomes unusually high.', 'end', 'Now the system can watch itself at the system level, not just handle one transaction at a time.'] ]},
endbad:{title:"You found the blind spot",scene:'The automation may be working “normally” on each message while something bigger is going wrong.',message:'This is why monitoring matters: unusual patterns can reveal a problem that individual transactions do not.',choices:[['Add a monitoring rule based on the normal baseline.', 'end', 'You add a feedback and monitoring loop so Mia can investigate unusual spikes.'] ]},
end:{title:"Mission complete",scene:'Mia now has a small, safe automation strategy instead of a giant chatbot project.',message:'You did not maximise automation. You maximised useful automation — with evidence, boundaries and humans where judgement is needed.',choices:[]}
};
let current='start';
const lessons=['Problem framing','Scope control','AI understands · automation acts','Source of truth','Automation boundaries','Human-in-the-loop','Monitoring & anomaly detection'];
function render(){const n=nodes[current];let html=`<div class="card"><div class="eyebrow">${current==='end'?'Mission complete':'You are the junior automation consultant'}</div><h2>${n.title}</h2><p class="scene">${n.scene}</p><div class="message">${n.message}</div>`;
if(n.choices.length){html+=`<div class="small"><b>What do you do?</b></div><div class="choices">`;n.choices.forEach((c,i)=>html+=`<button class="choice" onclick="choose(${i})">${c[0]}</button>`);html+=`</div><div id="result"></div>`}
else {html+=`<div class="result"><strong>Your consultant logbook</strong><div class="log">${lessons.map(x=>`<span class="pill">${x}</span>`).join('')}</div><p class="small">Next mission: map a messy process and decide which parts need AI, automation, or a human.</p></div><button class="next restart" onclick="location.reload()">Play again</button>`}
html+='</div>';document.getElementById('game').innerHTML=html}
function choose(i){const n=nodes[current],c=n.choices[i];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.getElementById('result').innerHTML=`<div class="result"><strong>${c[2]}</strong><button class="next" onclick="current='${c[1]}';render()">Continue →</button></div>`}
render();
</script></body></html>
