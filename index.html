<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automation Quest — Mission 01</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f3ff;color:#202033}.wrap{max-width:760px;margin:auto;padding:28px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-weight:800;font-size:20px}.xp{background:#fff;border:1px solid #e4e0ef;padding:8px 12px;border-radius:999px;font-weight:700}.card{background:#fff;border:1px solid #e4e0ef;border-radius:22px;padding:25px;box-shadow:0 8px 30px #0000000a}.kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.6}h1{font-size:30px;margin:8px 0 10px}h2{font-size:21px;margin:0 0 12px}p{line-height:1.55}.progress{height:8px;background:#e9e6f2;border-radius:99px;overflow:hidden;margin:16px 0 26px}.bar{height:100%;width:0;background:#6d5dfc;transition:.3s}.choice{width:100%;text-align:left;border:2px solid #e5e1ef;background:#fff;border-radius:15px;padding:15px;margin:8px 0;font-size:16px;cursor:pointer}.choice:hover{border-color:#6d5dfc}.choice:disabled{cursor:default}.correct{border-color:#36a269!important;background:#effbf4!important}.wrong{border-color:#d75a67!important;background:#fff1f2!important}.feedback{margin-top:16px;padding:15px;border-radius:15px;background:#f5f3fb;display:none}.feedback.show{display:block}.next{margin-top:18px;border:0;background:#202033;color:#fff;padding:13px 18px;border-radius:12px;font-weight:800;cursor:pointer}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eeeaff;font-size:12px;font-weight:800}.result{text-align:center}.score{font-size:48px;font-weight:900}.small{font-size:14px;opacity:.7}
</style></head><body><div class="wrap"><div class="top"><div class="logo">⚡ Automation Quest</div><div class="xp" id="xp">XP 0</div></div><div class="card"><div class="kicker">World 1 · Mission 01</div><h1>Don't Automate the Wrong Problem</h1><p class="small">You are a junior automation consultant. Mia runs a handmade-gift business and receives about 80 customer messages a day.</p><div class="progress"><div class="bar" id="bar"></div></div><div id="game"></div></div></div>
<script>
const qs=[
{t:"Mia asks for help. What do you do FIRST?",s:'Mia says: "My staff are drowning in messages. Can you automate this?"',c:[["Buy an AI chatbot immediately",0],["Ask AI to design the whole system",0],["Map the current workflow and understand the problem",1],["Start building an automation prototype",0]],w:"Exactly. Before building anything, understand what is actually happening. Otherwise you risk automating a problem that isn't the real bottleneck."},
{t:"You map the messages. Which opportunity is the best QUICK WIN?",s:"Opening-hours: 25/day. Order-status: 20/day. Customisation: 15/day. Pricing/payment: 10/day. Damaged/wrong orders: 5/day.",c:[["Automate opening-hours FAQs",1],["Build a complex AI complaint system",0],["Automate every type of message at once",0],["Ignore FAQs because they are too simple",0]],w:"Good. A quick win is repetitive, predictable and low-risk. You don't need AI for everything."},
{t:"Mia asks: “Why not automate the complaints too?",s:"A damaged-order complaint may require a refund, replacement, or judgement about what is fair.",c:[["Fully automate the refund decision",0],["Use AI to assist, but keep the decision with a human",1],["Never use automation for complaints",0],["Let AI decide if it sounds confident",0]],w:"The key principle: automate the PROCESS, not necessarily the DECISION. High-impact or judgement-heavy decisions need human oversight."},
{t:"Now design the order-status system.",s:'A customer asks: "Where is my order?" What should happen?',c:[["AI guesses the delivery date",0],["AI understands the request → automation checks the real order data → safe answer or human escalation",1],["A human manually checks every order",0],["AI searches the internet for the parcel",0]],w:"Yes. AI is useful for understanding messy language. Automation retrieves and acts on structured information from the real source of truth."},
{t:"The order says DELIVERED. The customer says: “It says delivered but I never got it.”",s:"Should the system automatically send a normal “Your order was delivered” message?",c:[["Yes, because the database says delivered",0],["No. Escalate because the customer's situation requires investigation",1],["Ask AI to decide whether the customer is lying",0],["Refund automatically",0]],w:"Correct. The status alone isn't enough. When the situation requires judgement or investigation, the human takes over."},
{t:"FINAL BOSS 🐉",s:"Normally there are 2 delivery complaints a day. Suddenly there are 25. What should your system do?",c:[["Do nothing; each complaint is handled separately",0],["Automatically refund everyone",0],["Monitor patterns and alert Mia when behaviour is unusually different from the normal baseline",1],["Tell AI to become more confident",0]],w:"This is monitoring and anomaly detection. Good automation doesn't just run — it watches for signs that something has gone wrong."}
];
let i=0,score=0,xp=0,answered=false;
function render(){answered=false;let q=qs[i];document.getElementById("bar").style.width=(i/qs.length*100)+"%";document.getElementById("game").innerHTML=`<span class="pill">Decision ${i+1}/${qs.length}</span><h2 style="margin-top:14px">${q.t}</h2><p>${q.s}</p><div>${q.c.map((x,n)=>`<button class="choice" onclick="pick(${n})">${x[0]}</button>`).join("")}</div><div class="feedback" id="fb"></div>`}
function pick(n){if(answered)return;answered=true;let q=qs[i],ok=!!q.c[n][1];document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(j===n)b.classList.add(ok?"correct":"wrong");if(q.c[j][1])b.classList.add("correct")});if(ok){score++;xp+=20;document.getElementById("xp").textContent="XP "+xp}let f=document.getElementById("fb");f.className="feedback show";f.innerHTML=`<b>${ok?"🎉 Nice!":"💡 Not quite."}</b><p>${q.w}</p><button class="next" onclick="next()">${i===qs.length-1?"See result":"Continue →"}</button>`}
function next(){i++;i<qs.length?render():finish()}
function finish(){document.getElementById("bar").style.width="100%";document.getElementById("game").innerHTML=`<div class="result"><div class="kicker">Mission complete</div><div class="score">${score}/${qs.length}</div><h2>${score>=5?"🔥 Automation instincts unlocked.":score>=4?"🔥 Great job!":"🧠 Good start!"}</h2><p>You earned <b>${xp} XP</b>.</p><p><b>Core lesson:</b> Great automation isn't about automating everything. Understand the problem, divide work between AI, automation and humans, and build safe boundaries.</p><button class="next" onclick="location.reload()">Play again ↻</button></div>`}render();
</script></body></html>
