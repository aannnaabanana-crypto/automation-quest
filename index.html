<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Automation Quest — Mission 01</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f5f0;color:#252525}.app{max-width:760px;margin:auto;padding:24px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-weight:800;font-size:18px}.tag{font-size:12px;color:#777}.card{background:#fff;border:1px solid #e7e2d8;border-radius:22px;padding:25px;box-shadow:0 8px 30px #0000000a;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#777}.title{font-size:32px;line-height:1.1;margin:8px 0 14px}.story{font-size:18px;line-height:1.55}.bubble{background:#f1eee7;border-radius:16px;padding:16px;margin:18px 0;font-style:italic}.choice,.submit{width:100%;text-align:left;border:1px solid #d9d3c8;background:#fff;border-radius:14px;padding:15px;margin:9px 0;font-size:16px;cursor:pointer}.choice:hover,.submit:hover{background:#f8f6f1}.input{width:100%;min-height:125px;border:1px solid #d9d3c8;border-radius:14px;padding:15px;font:inherit;resize:vertical}.submit{background:#252525;color:#fff;text-align:center;font-weight:700}.feedback{border-radius:16px;padding:18px;margin-top:18px}.consequence{background:#fff5df;border:1px solid #ead7ad}.good{background:#edf7ee;border:1px solid #cfe5d1}.learning{background:#eef4ff;border:1px solid #cbdaf3}.learning h3{margin:0 0 8px}.principle{font-weight:800;font-size:19px}.next{margin-top:15px;background:#252525;color:white;border:0;border-radius:13px;padding:13px 17px;font-weight:700;cursor:pointer}.hidden{display:none}.progress{height:5px;background:#e7e2d8;border-radius:99px;margin-bottom:22px}.bar{height:100%;width:0;background:#252525;border-radius:99px;transition:.3s}.small{font-size:14px;color:#777;line-height:1.5}.log{display:grid;gap:10px}.log div{padding:13px;border:1px solid #e5e0d6;border-radius:13px;background:#faf9f6}.restart{border:1px solid #bbb6ad;background:white;border-radius:12px;padding:12px 16px;font-weight:700}
</style></head><body><main class="app"><div class="top"><div class="brand">⚡ Automation Quest</div><div class="tag">World 1 · Mission 01</div></div><div class="progress"><div id="bar" class="bar"></div></div><div id="game"></div></main><script>
const scenes=[
{type:'open',title:'Don’t automate the wrong problem.',story:'You’re a junior automation consultant. Your client, Mia, runs a handmade-gift business and her team is drowning in customer messages.',bubble:'“We get about 80 messages a day. Can you just automate this for me?”',prompt:'What would you do first — and why?',answer:'Before choosing a tool, I would understand and map the current workflow to find the real bottleneck.',principle:'Problem framing comes before automation.',learn:'A client may describe a symptom (“too many messages”), but the real problem could be repetitive information retrieval, interruptions, poor routing, or something else. Your job is to solve the actual problem — not immediately add technology.'},
{type:'choice',title:'Mia’s inbox is not one problem.',story:'You map 80 daily messages and discover:',items:['25 — opening hours / basic information','20 — order status','15 — customisation questions','10 — pricing / payment','5 — damaged or wrong orders','5 — other'],prompt:'Mia asks: “Where should we start?”',choices:[['A','Automate the highest-risk complaints first.','risk'],['B','Start with a small, repetitive, low-risk problem.','quick'],['C','Build one AI chatbot to handle everything.','chatbot']],good:'B',principle:'Start with the right-sized opportunity.',learn:'The biggest problem is not always the best first automation. A low-risk, repetitive task can create a quick win, reduce workload, and build confidence before tackling more complex workflows.'},
{type:'choice',title:'Mia wants complaints automated too.',story:'After the quick win, Mia says:',bubble:'“Can AI just handle damaged orders and issue refunds automatically?”',prompt:'What would you design?',choices:[['A','Let AI decide whether to refund.','bad'],['B','Let AI gather the information and recommend a response; a human decides the refund.','good'],['C','Keep the entire complaint process manual.','manual']],good:'B',principle:'Automate the process, not necessarily the decision.',learn:'AI can interpret messy messages and collect useful information. But decisions involving judgement, money, exceptions, or customer impact often need a human boundary.'},
{type:'open',title:'Now build the order-status flow.',story:'Mia wants to reduce “Where is my order?” messages. The system has access to the courier’s live tracking information.',prompt:'In one or two sentences, describe how you would design the flow. Who understands the customer’s message? Who checks the real order status? What happens when something is unusual?',answer:'AI interprets the customer’s request and extracts the order number; automation retrieves the current status from the source of truth; routine cases get an automatic answer, while unusual or uncertain cases go to a human.',principle:'AI understands → automation acts → human handles exceptions.',learn:'This separation keeps the system predictable. AI is useful for interpreting natural language; automation is good at retrieving data, applying rules, and taking repeatable actions; humans handle judgement and exceptions.'},
{type:'choice',title:'One more problem: the data looks fine…',story:'A customer orders 2 pink gift boxes. The inventory system says “2 in stock.” But one box is already reserved for another customer.',prompt:'Should the system accept the order automatically?',choices:[['A','Yes — the database says 2 are in stock.','naive'],['B','No — it should check orderable/available stock, including reservations, before accepting.','good'],['C','Ask the AI to decide whether the box is really available.','ai']],good:'B',principle:'Automation is only as reliable as the data and rules behind it.',learn:'“In stock” and “available to sell” are not always the same state. Reliable automation validates the real business state before acting.'},
{type:'choice',title:'The system goes live.',story:'For a few days, everything looks normal. Then Mia notices 25 customers say their orders were marked “delivered” but they never received them. Normally, there are only 1–2 such complaints a day.',prompt:'What would you add to the system?',choices:[['A','Wait for Mia to notice the problem again.','wait'],['B','Automatically refund every affected customer.','refund'],['C','Monitor the normal baseline and alert Mia when unusual patterns appear.','good']],good:'C',principle:'Good automation monitors itself.',learn:'Automation does not end when the workflow goes live. Monitoring creates a feedback loop: establish what “normal” looks like, detect unusual behaviour, and alert a human before a small problem becomes a large one.'}
];
let i=0,answers=[];const game=document.getElementById('game');const bar=document.getElementById('bar');
function render(){bar.style.width=((i)/scenes.length*100)+'%';const s=scenes[i];let h=`<section class="card"><div class="eyebrow">Mission ${i+1} of ${scenes.length}</div><h1 class="title">${s.title}</h1><div class="story">${s.story}</div>${s.bubble?`<div class="bubble">${s.bubble}</div>`:''}`;
if(s.type==='open'){h+=`<div class="small"><b>Your move:</b> think before you reveal the teaching point.</div><textarea id="ans" class="input" placeholder="Write what you would do and why..."></textarea><button class="submit" onclick="submitOpen()">Lock in my thinking</button>`}
else {h+=`<div class="small"><b>Your move:</b> choose what you would actually do.</div><div id="choices">${s.choices.map(c=>`<button class="choice" onclick="choose('${c[0]}')"><b>${c[0]}</b> — ${c[1]}</button>`).join('')}</div>`}h+='</section>';game.innerHTML=h}
function submitOpen(){const a=document.getElementById('ans').value.trim();if(!a){alert('Give it a try first — there are no perfect words needed.');return}answers.push(a);showLearning(false,a)}
function choose(letter){const s=scenes[i];answers.push(letter);const good=letter===s.good;const choice=s.choices.find(x=>x[0]===letter);let consequence=good?'That decision keeps the system on a safe, practical path.':'That approach creates a problem Mia will have to deal with later.';if(letter==='chatbot')consequence='The chatbot may answer simple questions, but now you have a huge system to test — including risky edge cases you have not understood yet.';if(letter==='bad')consequence='An AI could misunderstand a complaint, and an automatic refund could cost Mia money or create inconsistent decisions.';if(letter==='manual')consequence='Keeping everything manual avoids automation risk, but it also misses the opportunity to remove repetitive work while keeping judgement with staff.';if(letter==='naive')consequence='The system accepts the order, then discovers the “second” box was promised to someone else. Mia now has an avoidable fulfilment problem.';if(letter==='ai')consequence='AI should not be the source of truth for inventory. It can interpret a message, but the actual inventory system should determine availability.';if(letter==='wait')consequence='By the time Mia notices, the problem may already have affected many customers.';if(letter==='refund')consequence='A spike in complaints does not automatically tell you what caused the problem or what remedy is appropriate.';showLearning(good,choice[1],consequence)}
function showLearning(good,userText,consequence){const s=scenes[i];const card=document.querySelector('.card');const fb=document.createElement('div');fb.innerHTML=`<div class="feedback ${good?'good':'consequence'}"><b>${good?'✓ Your decision works':'⚠️ See what happens'}</b><p>${consequence||'Your thinking is recorded. Now compare it with the principle we are looking for.'}</p></div><div class="feedback learning"><h3>💡 What you just discovered</h3><div class="principle">${s.principle}</div><p>${s.learn}</p>${s.type==='open'?`<p class="small"><b>Your thinking:</b> “${escapeHtml(userText)}”</p>`:''}<button class="next" onclick="next()">${i===scenes.length-1?'Complete mission →':'Continue the story →'}</button></div>`;card.appendChild(fb);document.querySelectorAll('.choice,.submit,.input').forEach(x=>x.disabled=true)}
function next(){i++;if(i<scenes.length)render();else finish()}
function finish(){bar.style.width='100%';game.innerHTML=`<section class="card"><div class="eyebrow">Mission complete</div><h1 class="title">You didn’t just automate. You designed a system.</h1><div class="story">Mia’s workflow now has clear boundaries between AI, automation, and human judgement.</div><div class="log"><div>🧭 <b>Problem framing</b><br><span class="small">Understand the real problem before choosing technology.</span></div><div>⚙️ <b>AI + automation</b><br><span class="small">AI interprets; automation performs predictable actions.</span></div><div>👩‍💻 <b>Human-in-the-loop</b><br><span class="small">Escalate decisions and exceptions that need judgement.</span></div><div>🛡️ <b>Guardrails + source of truth</b><br><span class="small">Use reliable data and define when the system must stop.</span></div><div>📈 <b>Monitoring</b><br><span class="small">Watch the system for unusual behaviour after launch.</span></div></div><button class="next" onclick="location.reload()">Replay mission</button></section>`}
function escapeHtml(x){return x.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}render();
</script></body></html>
